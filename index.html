<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAS Film Ranker</title>
<style>
  :root {
    --bg: #faf9f6;
    --card: #ffffff;
    --border: #e4e2dc;
    --text: #1c1c1a;
    --text-secondary: #6b6a64;
    --text-muted: #9b9a93;
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --star-empty: #d3d1c7;
    --danger: #a32d2d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --card: #262624;
      --border: #3a3a37;
      --text: #f1efe8;
      --text-secondary: #b4b2a9;
      --text-muted: #888780;
      --accent: #85b7eb;
      --accent-bg: #0c447c;
      --star-empty: #444441;
      --danger: #f09595;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 2rem 1rem 4rem;
  }
  
  .wrap { max-width: 1200px; margin: 0 auto; }
  
  .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; }
  
  #langSelect {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    outline: none;
  }

  /* Layout System */
  .layout { display: flex; gap: 2rem; align-items: flex-start; }
  .left-col { flex: 1; min-width: 250px; position: sticky; top: 2rem; }
  .mid-col { flex: 2; min-width: 320px; }
  .right-col { flex: 1.2; min-width: 280px; position: sticky; top: 2rem; }

  @media (max-width: 992px) {
    .layout { flex-direction: column; }
    .left-col, .mid-col, .right-col { width: 100%; position: static; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 0.75rem;
  }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 0.75rem; text-transform: lowercase; }
  
  .example-item {
    margin-bottom: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .example-item:last-child {
    margin-bottom: 0;
    padding-bottom: 0;
    border-bottom: none;
  }
  .example-title {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 4px 0;
    color: var(--text);
  }
  .example-desc {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0;
    line-height: 1.4;
  }
  
  input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    margin-bottom: 0.75rem;
  }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 0.6rem; }
  .row label { font-size: 13px; color: var(--text-secondary); width: 130px; flex-shrink: 0; }
  .row input[type="range"] { flex: 1; accent-color: var(--accent); }
  .row .out { font-size: 13px; font-weight: 600; min-width: 26px; text-align: right; }
  
  .result {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 1rem 1.25rem; margin: 1rem 0;
  }
  .result .num { font-size: 26px; font-weight: 600; margin: 4px 0 0; }
  .result .label { font-size: 12px; color: var(--text-secondary); }
  
  .stars { display: flex; gap: 2px; }
  .star { position: relative; width: 20px; height: 20px; }
  .star svg { position: absolute; inset: 0; width: 20px; height: 20px; }
  .star .empty path { fill: var(--star-empty); }
  .star .fill path { fill: var(--accent); }
  .star .fillwrap { position: absolute; inset: 0; overflow: hidden; }
  
  button {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  button:hover { background: var(--accent-bg); }
  #saveBtn { width: 100%; margin-bottom: 1.5rem; }
  
  .savedRow {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border); padding: 10px 0;
  }
  .savedRow:last-child { border-bottom: none; }
  .savedRow .title { font-size: 14px; font-weight: 600; margin: 0; }
  .savedRow .meta { font-size: 12px; color: var(--text-muted); margin: 2px 0 0; }
  .savedRow .score { font-size: 16px; font-weight: 600; }
  .delBtn { padding: 6px 8px; color: var(--danger); border: none; background: none; font-size: 13px; font-weight: 400; }
  
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin: 1.5rem 0 0.5rem; }
  .toolbar h2 { font-size: 15px; font-weight: 600; margin: 0; text-transform: lowercase; }
  .toolbar button { font-size: 12px; padding: 6px 10px; font-weight: normal; }
  .empty-state { font-size: 13px; color: var(--text-muted); padding: 8px 0; }
  .footer-note {
    text-align: right;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
  }

</style>
</head>
<body>
<div class="wrap">

</div>

const CRITERIA = {
  zanaat: [
    ['cine', { en: 'Cinematography', tr: 'Sinematografi' }], 
    ['senaryo', { en: 'Scenario', tr: 'Senaryo' }], 
    ['oyun', { en: 'Acting', tr: 'Oyunculuk' }],
    ['teknik', { en: 'Technical Execution', tr: 'Teknik İşçilik' }], 
    ['akici', { en: 'Pacing', tr: 'Akıcılık' }],
    ['ses', { en: 'Sound & Score', tr: 'Ses ve Müzik' }],
    ['kurgu', { en: 'Editing', tr: 'Kurgu' }],
    ['sanat', { en: 'Production Design', tr: 'Sanat Yönetimi' }],
    ['yonetmen', { en: 'Directing', tr: 'Yönetmenlik' }]
  ],
  derinlik: [
    ['altmetin', { en: 'Subtext', tr: 'Alt Metin' }], 
    ['ozgun', { en: 'Authenticity', tr: 'Özgünlük' }],
    ['karakter', { en: 'Character Arc', tr: 'Karakter Gelişimi' }]
  ],
  kisisel: [

    ['kalici', { en: 'Permanence', tr: 'Kalıcılık' }]
  ]

function buildSliders(containerId, items) {
  const c = document.getElementById(containerId);
  items.forEach(([id, labels]) => {
    let row = document.getElementById(`row-${id}`);
    if (!row) {
      row = document.createElement('div');
      row.className = 'row';
      row.id = `row-${id}`;
      row.innerHTML = `
        <label id="label-${id}">${labels[currentLang]}</label>
        <input type="range" min="1" max="5" step="0.5" value="3" id="${id}">
        <span class="out" id="${id}Out">3</span>`;
      c.appendChild(row);
      document.getElementById(id).addEventListener('input', updateAll);
    } else {
      document.getElementById(`label-${id}`).textContent = labels[currentLang];
    }
  });
}

function initSliders() {
  buildSliders('zanaatSliders', CRITERIA.zanaat);
  buildSliders('derinlikSliders', CRITERIA.derinlik);
  buildSliders('kisiselSliders', CRITERIA.kisisel);
}

function updateInterfaceLanguage() {
  const dict = DICT[currentLang];
  document.documentElement.lang = currentLang;
  
  // Main UI Texts
  document.getElementById('appTitle').textContent = dict.appTitle;
  document.getElementById('filmTitle').placeholder = dict.placeholder;
  document.getElementById('titleZanaat').textContent = dict.titleZanaat;

  document.getElementById('warningBox').textContent = dict.warningText;

  // Wiki Texts

  document.getElementById('wiki7Title').textContent = dict.wiki7Title;
  document.getElementById('wiki7Desc').textContent = dict.wiki7Desc;

document.getElementById('langSelect').addEventListener('change', (e) => {
  currentLang = e.target.value;
  updateInterfaceLanguage();
});

function avg(items) {
  return items.reduce((s, [id]) => s + parseFloat(document.getElementById(id).value), 0) / items.length;
}

function computeFinal() {
  const z = avg(CRITERIA.zanaat);
  const d = avg(CRITERIA.derinlik);
  const k = avg(CRITERIA.kisisel);
  let final = (z * 1 + d * 1 + k * 1.5) / 3.5; 
  final = Math.round(final * 2) / 2;
  return { final, z, d, k };
}

const STAR_PATH = 'M10 1.5l2.6 5.6 6 0.8-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6-4.4-4.2 6-0.8z';

function renderStars(container, value) {
  container.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const fillPct = Math.max(0, Math.min(1, value - i)) * 100;
    const star = document.createElement('span');
    star.className = 'star';
    star.innerHTML = `
      <span class="empty"><svg viewBox="0 0 20 20"><path d="${STAR_PATH}"/></svg></span>
      <span class="fillwrap" style="width:${fillPct}%">
        <span class="fill"><svg viewBox="0 0 20 20"><path d="${STAR_PATH}"/></svg></span>
      </span>`;
    container.appendChild(star);
  }
}

function updateAll() {
  [...CRITERIA.zanaat, ...CRITERIA.derinlik, ...CRITERIA.kisisel].forEach(([id]) => {
    document.getElementById(id + 'Out').textContent = document.getElementById(id).value;
  });
  const { final } = computeFinal();
  document.getElementById('resultVal').textContent = final.toFixed(1);
  renderStars(document.getElementById('starRow'), final);
}

function getSaved() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch (e) { return []; }
}
function setSaved(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function renderSaved() {
  const dict = DICT[currentLang];
  const listEl = document.getElementById('savedList');
  const items = getSaved().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  if (items.length === 0) {
    listEl.innerHTML = `<p class="empty-state">${dict.emptyState}</p>`;
    return;
  }
  listEl.innerHTML = '';
  items.forEach(item => {
    const row = document.createElement('div');
    row.className = 'savedRow';
    const dateStr = item.date ? new Date(item.date).toLocaleDateString(currentLang === 'tr' ? 'tr-TR' : 'en-US') : '';
    
    const zName = DICT[currentLang].titleZanaat;
    const dName = DICT[currentLang].titleDerinlik;
    const kName = DICT[currentLang].titleKisisel;

    row.innerHTML = `<div>
        <p class="title">${item.title}</p>
        <p class="meta">${zName} ${item.z.toFixed(1)} · ${dName} ${item.d.toFixed(1)} · ${kName} ${item.k.toFixed(1)} · ${dateStr}</p>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="score">${item.final.toFixed(1)}</span>
        <button class="delBtn" data-id="${item.id}">${dict.delBtn}</button>
      </div>`;
    listEl.appendChild(row);
  });
  listEl.querySelectorAll('.delBtn').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-id');
      setSaved(getSaved().filter(f => f.id !== id));
      renderSaved();
    });
  });
}

document.getElementById('saveBtn').addEventListener('click', () => {
  const title = document.getElementById('filmTitle').value.trim();
  if (!title) { document.getElementById('filmTitle').focus(); return; }
  const { final, z, d, k } = computeFinal();
  const item = { id: Date.now().toString(), title, final, z, d, k, date: new Date().toISOString() };
  const list = getSaved();
  list.push(item);
  setSaved(list);
  document.getElementById('filmTitle').value = '';
  renderSaved();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const items = getSaved().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const header = 'Film,Score,Artisanship,Depth,Personal Impact,Date';
  const rows = items.map(i => {
    const dateStr = i.date ? new Date(i.date).toLocaleDateString(currentLang === 'tr' ? 'tr-TR' : 'en-US') : '';
    const safeTitle = '"' + i.title.replace(/"/g, '""') + '"';
    return [safeTitle, i.final.toFixed(1), i.z.toFixed(1), i.d.toFixed(1), i.k.toFixed(1), dateStr].join(',');
  });
  const csv = [header, ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'film-ratings.csv';
  a.click();
  URL.revokeObjectURL(url);
});

initSliders();
updateInterfaceLanguage();
updateAll();

</script>
</body>
</html>
